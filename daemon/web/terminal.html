<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>terminal</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; }
  /* The pty is sized from this box, so it is the viewport minus the safe area
     and nothing else — any padding here has to be paid for in the fit maths. */
  #term { position: absolute; inset: 0; padding: 4px;
    padding-bottom: max(4px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  #overlay { position: absolute; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.78); color: #eee; font: 15px/1.4 system-ui, sans-serif;
    text-align: center; padding: 24px; -webkit-tap-highlight-color: transparent; }
  #overlay.on { display: grid; }
  #overlay b { display: block; font-size: 17px; margin-bottom: 6px; }
  #overlay span { color: #999; }
</style>

<div id="term"></div>
<div id="overlay"><div><b id="ovt">connecting…</b><span id="ovs">tap to retry</span></div></div>

<script src="/vendor/xterm.js"></script>
<script>
(() => {
  "use strict";
  const FONT = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
  const FONT_SIZE = 13, LINE_HEIGHT = 1.15;

  const box = document.getElementById("term");
  const overlay = document.getElementById("overlay");
  const ovt = document.getElementById("ovt"), ovs = document.getElementById("ovs");
  const show = (title, sub) => { ovt.textContent = title; ovs.textContent = sub || ""; overlay.classList.add("on"); };
  const hide = () => overlay.classList.remove("on");

  const term = new Terminal({
    fontFamily: FONT, fontSize: FONT_SIZE, lineHeight: LINE_HEIGHT,
    cursorBlink: true, scrollback: 5000, allowProposedApi: false,
    theme: { background: "#0b0b0b", foreground: "#eee", cursor: "#2b6", selectionBackground: "#2b62" },
  });
  term.open(box);

  // ponytail: hand-rolled fit instead of @xterm/addon-fit — one measurement and
  // a division, against one more vendored file to serve. Measure with the same
  // font/size the terminal renders in, then floor so we never overflow the box.
  // Measured on every fit, not once at load: a probe that runs before the font
  // is ready measures a face the terminal never renders in, and the pty's
  // columns are where the SHELL decides to wrap — off by one there is output
  // breaking mid-word in the middle of the screen for the life of the terminal.
  const cellSize = () => {
    const probe = document.createElement("div");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-family:" +
      FONT + ";font-size:" + FONT_SIZE + "px;line-height:normal";
    probe.textContent = "W".repeat(100);
    document.body.appendChild(probe);
    const r = probe.getBoundingClientRect();
    probe.remove();
    return { w: r.width / 100, h: Math.ceil(r.height * LINE_HEIGHT) };
  };
  // The geometry the terminal ACTUALLY renders at, or null when there is none to
  // read yet: a page laid out at 0x0 (a WebView not on screen, a background tab)
  // must not be turned into a 2-column pty that then never grows. Null is "ask
  // again", never a guess.
  const fit = () => {
    const s = getComputedStyle(box);
    const w = box.clientWidth - parseFloat(s.paddingLeft) - parseFloat(s.paddingRight);
    const h = box.clientHeight - parseFloat(s.paddingTop) - parseFloat(s.paddingBottom);
    const cell = cellSize();
    if (!(w > 0 && h > 0 && cell.w > 0 && cell.h > 0)) return null;
    const cols = Math.max(2, Math.floor(w / cell.w)), rows = Math.max(1, Math.floor(h / cell.h));
    if (cols !== term.cols || rows !== term.rows) term.resize(cols, rows);
    return { cols, rows };
  };
  // Resolves on the first real measurement. A 0x0 box fires no event of its own
  // — the ResizeObserver below is what reports that layout finally happened.
  let awaiting = null;
  const geometry = async () => {
    // Fonts before maths: measuring the fallback face and rendering the real one
    // is the same bug as measuring a 0x0 box, only harder to see.
    try { await document.fonts.ready; } catch {}
    return fit() ?? new Promise((resolve) => { awaiting = resolve; });
  };

  // --- wire ----------------------------------------------------------------
  let ws = null, seq = 0, termId = null, cfg = null;
  const pending = new Map();
  const call = (method, params) => new Promise((resolve, reject) => {
    if (!ws || ws.readyState !== 1) return reject(new Error("offline"));
    const id = String(++seq);
    pending.set(id, { resolve, reject });
    ws.send(JSON.stringify({ type: "req", id, method, params }));
  });

  // This page is served BY the daemon, so its own origin is the daemon's — the
  // host never gets to name the WS destination. A config message that could
  // point elsewhere would be a way to post the token to an attacker's socket.
  const WS_URL = "ws://" + location.host + "/ws";

  function connect(c) {
    cfg = c;
    if (ws) { try { ws.close(); } catch {} ws = null; }
    show("connecting…", location.host);
    const sock = new WebSocket(WS_URL);
    ws = sock;
    sock.onopen = () => sock.send(JSON.stringify({ type: "auth", token: c.token }));
    sock.onerror = () => {}; // onclose is the one that decides; an error alone is noise
    sock.onclose = () => {
      if (ws !== sock) return; // superseded by a newer connect
      for (const p of pending.values()) p.reject(new Error("closed"));
      pending.clear();
      ws = null;
      show("disconnected", "tap to reconnect");
    };
    sock.onmessage = async (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === "res") {
        const p = pending.get(m.id);
        if (!p) return;
        pending.delete(m.id);
        return m.ok ? p.resolve(m.data) : p.reject(new Error(m.error));
      }
      if (m.type === "event") {
        const e = m.event;
        // Every authed client sees every terminal's output; only ours is ours.
        if (e.kind === "term.data" && e.termId === termId) term.write(e.data);
        else if (e.kind === "term.exit" && e.termId === termId) {
          termId = null;
          show("terminal exited (" + e.code + ")", "tap to start a new one");
        }
        return;
      }
      if (m.type !== "auth.ok") return;
      try {
        // Never create against an unmeasured box: this awaits a real one.
        const first = await geometry();
        if (c.termId) {
          // Reattaching: the daemon still holds whatever size the other client
          // set, but this screen is what is being looked at now.
          termId = c.termId;
        } else {
          termId = (await call("term.create", { cwd: c.cwd || ".", cols: first.cols, rows: first.rows })).termId;
        }
        // Re-assert against the box as it is NOW: the round-trip above is long
        // enough for a rotation or a keyboard, and any resize the observer tried
        // to send during it was dropped for want of a termId.
        const g = fit() || first;
        await call("term.resize", { termId, cols: g.cols, rows: g.rows });
        // Replay before the live feed can interleave: term.data for this id can
        // only arrive after term.create returned, and this await runs first.
        term.reset();
        const { data } = await call("term.scrollback", { termId });
        if (data) term.write(data);
        hide();
        term.focus();
      } catch (e) {
        show("failed", String(e && e.message || e));
      }
    };
  }

  // One channel back to whatever is hosting this page: the RN WebView, or the
  // parent frame in a browser. Only non-secret status ever goes this way.
  const toHost = (m) => {
    const s = JSON.stringify(m);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s);
    else if (window.parent !== window) window.parent.postMessage(s, "*");
  };

  const send = (d) => { if (termId) call("term.write", { termId, data: d }).catch(() => {}); };

  // Sticky Ctrl. The soft keyboard types straight into xterm's hidden textarea,
  // so the host cannot modify a keystroke on its way past — the page has to be
  // the one that applies the modifier, and the one that says it was used up.
  let ctrl = false;
  const asCtrl = (d) => {
    if (d.length !== 1) return d;
    const c = d.toUpperCase().charCodeAt(0);
    return c >= 64 && c < 128 ? String.fromCharCode(c & 31) : d; // C -> \x03
  };
  window.wbCtrl = (on) => { ctrl = !!on; term.focus(); };
  term.onData((d) => {
    // Only a single typed character uses the modifier up. onData also carries
    // escape sequences the user never pressed — focus in/out reports, arrows, a
    // paste — and arming Ctrl focuses the terminal, so without this guard the
    // focus report it triggers would consume the modifier before the letter.
    if (ctrl && d.length === 1) { ctrl = false; toHost({ type: "ctrl", on: false }); d = asCtrl(d); }
    send(d);
  });
  // The host's key accessory row (Esc/Tab/arrows/punctuation) reaches the pty
  // through here. Refocus, or the tap that sent it leaves the hidden textarea
  // blurred and the phone keyboard slides away.
  window.wbSend = (d) => { send(d); term.focus(); };
  // ResizeObserver on the box, not window "resize": a page that is laid out at
  // 0x0 (created in a background tab / a WebView not yet on screen) would
  // otherwise size the pty to 2x1 and stay there — the window never resizes,
  // only the box does. It covers rotation and the on-screen keyboard too.
  // Debounced because an Android keyboard animation fires it every frame.
  let rt = null;
  const remeasure = () => {
    const g = fit();
    if (g === null) return; // still no layout; the next tick is the retry
    if (awaiting) { const resolve = awaiting; awaiting = null; resolve(g); }
    if (termId) call("term.resize", { termId, cols: g.cols, rows: g.rows }).catch(() => {});
  };
  const later = () => { clearTimeout(rt); rt = setTimeout(remeasure, 120); };
  new ResizeObserver(later).observe(box);
  // Belt to the observer's braces for the keyboard: on the browsers where the
  // soft keyboard shrinks the layout viewport the box changes and the observer
  // has it already, but where it only shrinks the *visual* one this is the only
  // event that fires. Same debounce, and a fit that measures the same numbers
  // sends nothing.
  if (window.visualViewport) window.visualViewport.addEventListener("resize", later);
  overlay.addEventListener("click", () => { if (cfg) connect(cfg); });

  // --- host handshake ------------------------------------------------------
  // The token arrives by message, never from the URL: a query string lands in
  // history, logs and the Referer of anything the page loads. Contract:
  // {token, termId?, cwd} — no host/port, see WS_URL above.
  const onHostMessage = (ev) => {
    let c = ev.data;
    if (typeof c === "string") { try { c = JSON.parse(c); } catch { return; } }
    if (!c) return;
    // The host's key accessory row. A no-op until a config has authed, so a
    // frame that never handed over a token cannot type into anything.
    if (typeof c.send === "string") { window.wbSend(c.send); return; }
    if (typeof c.ctrl === "boolean") { window.wbCtrl(c.ctrl); return; }
    if (typeof c.token !== "string") return; // not for us
    // The host posts the config on both `ready` and onLoadEnd (the ready
    // handshake is one-shot and would leave the screen dead if the RN bridge
    // was not installed yet), so a duplicate is expected: first config wins —
    // reconnecting would create a second pty for the same screen.
    if (cfg) return;
    connect(c);
  };
  // RN's injectJavaScript dispatches to `window` on iOS and `document` on
  // Android depending on version — listen on both, ignore what isn't ours.
  window.addEventListener("message", onHostMessage);
  document.addEventListener("message", onHostMessage);

  if (window.ReactNativeWebView || window.parent !== window) {
    toHost({ type: "ready" });
    show("waiting for the app…", "");
  } else if (new URLSearchParams(location.search).has("dev")) {
    // Desktop debugging only. sessionStorage, so the token survives a reload
    // without ever being in the URL.
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem("wb.terminal") || "null"); } catch {}
    const token = saved?.token || prompt("daemon token");
    if (token) {
      const c = { token, cwd: saved?.cwd || "." };
      try { sessionStorage.setItem("wb.terminal", JSON.stringify(c)); } catch {}
      connect(c);
    } else {
      show("no token", "reload with ?dev=1 to try again");
    }
  } else {
    show("waiting for the app…", "");
  }
})();
</script>
